[package]
name = "NeuralEnsembleTelemetryFabricLuminalOracleWizard9"
version = "0.0.2"
edition = "2024"
rust-version = "1.85"
description = "NeuralEnsembleTelemetryFabricLuminalOracleWizard9: a validated NetFlow v9 and IPFIX generator with offline preview"
license = "PolyForm-Noncommercial-1.0.0"

[[bin]]
name = "nfv9gen"
path = "src/main.rs"

[lib]
name = "neural_ensemble_telemetry_fabric_luminal_oracle_wizard9"

[dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
