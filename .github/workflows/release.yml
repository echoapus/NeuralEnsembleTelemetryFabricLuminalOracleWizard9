name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: |
          cargo test --locked
          node --test tests/*.test.cjs
      - name: Build and verify
        run: |
          cargo build --release --locked
          ./target/release/nfv9gen --version
          ./target/release/nfv9gen validate examples/basic.json
          ./target/release/nfv9gen preview examples/basic.json --kind data --hex
      - name: Package
        run: |
          mkdir -p dist/nfv9gen-linux-x86_64
          cp target/release/nfv9gen LICENSE *.md config-builder.html dist/nfv9gen-linux-x86_64/
          cp -R examples dist/nfv9gen-linux-x86_64/
          tar -C dist -czf dist/nfv9gen-linux-x86_64.tar.gz nfv9gen-linux-x86_64
          cd dist
          sha256sum nfv9gen-linux-x86_64.tar.gz > nfv9gen-linux-x86_64.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: nfv9gen-linux-x86_64
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nfv9gen-linux-x86_64
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/* --verify-tag --generate-notes --title "$RELEASE_TAG"
